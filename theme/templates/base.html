{% load tailwind_tags %}
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <title>MyWallet</title>
    {% tailwind_css %}
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>

    <!-- Alpine.js -->
    <script src="https://unpkg.com/alpinejs" defer></script>

    <!-- Stimulus.js -->
    <script type="module">
        import {Application} from "https://unpkg.com/@hotwired/stimulus/dist/stimulus.js";

        window.Stimulus = Application.start();
    </script>
    
    <style>
        /* Custom styles for theme colors */
        :root {
            /* Primary colors (Emerald Green) are defined in styles.css */
            /* Additional custom styles can be added here */
        }
        
        /* Smooth transitions for theme switching */
        .transition-theme {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body x-data="{ darkMode: localStorage.getItem('darkMode') === 'true', language: 'es', currency: 'USD', mobileMenuOpen: false }" x-init="$watch('darkMode', val => localStorage.setItem('darkMode', val))" :class="{ 'dark': darkMode }" class="transition-theme">
    <div class="min-h-screen bg-white dark:bg-gray-900 text-gray-900 dark:text-white transition-theme">
    {% include 'components/header.html' %}
    {% block content %}{% endblock %}
    {% include 'components/footer.html' %}
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register("{% static 'service-worker.js' %}")
                .then(reg => console.log("Service Worker registrado"))
                .catch(err => console.log("Error en Service Worker", err));
        }
    </script>
</body>
</html>
